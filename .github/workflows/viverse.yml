name: Deploy to Viverse

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      secrets-available: ${{ steps.check.outputs.secrets-available }}
    steps:
      - id: check
        run: |
          if [[ -n "${{ secrets.VIVERSE_EMAIL }}" && -n "${{ secrets.VIVERSE_PASSWORD }}" ]]; then
            echo "secrets-available=true" >> $GITHUB_OUTPUT
          else
            echo "secrets-available=false" >> $GITHUB_OUTPUT
          fi

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: check-secrets
    # Only run if secrets are present
    if: needs.check-secrets.outputs.secrets-available == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Viverse Login
        run: npx viverse-cli auth login -e ${{ secrets.VIVERSE_EMAIL }} -p ${{ secrets.VIVERSE_PASSWORD }}

      - name: Deploy to Viverse
        run: npx viverse-cli app publish ./dist --auto-create-app --name react-three-mega-comet

